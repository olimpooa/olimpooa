spring.application.name=achados-perdidos

# Banco H2 em arquivo (dados persistem em ./data entre execuções)
spring.datasource.url=jdbc:h2:file:./data/achados;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never

# --- Configuração do Achados e Perdidos (valores sensíveis vêm de variáveis de ambiente) ---
achados.base-url=${APP_BASE_URL:http://localhost:8080}
achados.diretorio-uploads=${UPLOADS_DIR:./uploads}

# Login do responsável (valores fictícios de demonstração; troque em qualquer uso real)
achados.admin.usuario=${ADMIN_USUARIO:responsavel}
achados.admin.senha=${ADMIN_SENHA:ucsal2026}

# IA: auto = Gemini se GEMINI_API_KEY existir, senão modo simulado | gemini | simulado
achados.ia.provedor=${IA_PROVEDOR:auto}
achados.ia.api-key=${GEMINI_API_KEY:}
achados.ia.modelo=${GEMINI_MODELO:gemini-3.1-flash-lite}
achados.ia.timeout-segundos=30

# E-mail: simulado = só registra na caixa de saída | smtp = envia (defina SPRING_MAIL_HOST etc.)
achados.notificacao.modo=${NOTIFICACAO_MODO:simulado}
achados.notificacao.email-responsavel=${EMAIL_RESPONSAVEL:responsavel@ucsal.edu.br}
achados.notificacao.remetente=${EMAIL_REMETENTE:achados-perdidos@ucsal.edu.br}

# Carrega itens fictícios de demonstração quando o banco está vazio
achados.demo.carregar=${CARREGAR_DEMO:true}
